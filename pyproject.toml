[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "samudra-manthan"
version = "0.1.0"
description = "An open-source Gmail cleanup utility."
requires-python = ">=3.12"

[project.scripts]
sm = "samudra_manthan.main:main"

[tool.setuptools.packages.find]
where = ["src"]
